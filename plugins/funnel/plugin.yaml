version: 1
id: funnel
name: Funnel
description: Configurable YAML-driven command and network-test simulation preview
enabled: false
roles: [admin, operator]
runtime:
  kind: exec
  binary: funnel
  timeout_ms: 3000
commands:
  - name: info
    description: Show the validated Funnel configuration
    capability: code.invoke
  - name: methods
    description: List available simulation scenarios
    capability: code.invoke
  - name: preview
    description: Preview a bounded local-only test scenario without sending traffic
    capability: code.invoke
