version: 1
id: rpc-counter
name: Persistent Counter
description: "Real Go RPC demonstration with brokered persistent storage and events"
enabled: false
roles: [admin, operator]
runtime:
  kind: exec-rpc
  binary: rpc-counter
  timeout_ms: 4000
  capabilities: [storage.get, storage.put, events.publish, ui.publish, server.metrics]
commands:
  - name: counter
    description: Increment a persistent server-side counter
    capability: code.invoke
app:
  enabled: true
  title: Persistent Counter
  entry: overview
  navigation:
    - id: overview
      title: Overview
      view: overview
    - id: details
      title: Details
      view: details
  actions:
    - id: app.increment
      command: counter
