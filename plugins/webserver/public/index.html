<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sentinel V5 · Web Server</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.6 system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; color:#e6ecf8; background: radial-gradient(ellipse at 70% 15%, #172c48, transparent 55%),#090e18; padding:24px; }
    main { width:min(720px,100%); padding:clamp(26px,6vw,54px); border:1px solid #293849; border-radius:22px; background:#101826bb; box-shadow:0 24px 90px #0008; }
    .kicker { letter-spacing:.16em; color:#83caff; font-size:.74rem; text-transform:uppercase; font-weight:700; }
    h1 { font-size:clamp(2rem,6vw,3.7rem); letter-spacing:-.045em; line-height:1.15; margin:12px 0; }
    p { max-width:56ch; color:#aebcd0; }
    .stat { display:inline-flex; gap:9px; align-items:center; margin-top:24px; padding:9px 14px; border:1px solid #334759; border-radius:100px; font-size:.83rem; }
    .dot { width:8px;height:8px;background:#4fe0a1;border-radius:50%;box-shadow:0 0 16px #4fe0a1;}
    code { background:#1b2a3c; color:#aee5ff; padding:3px 7px; border-radius:5px; }
    a { color:#83caff; }
  </style>
</head>
<body>
 <main>
   <div class="kicker">Sentinel V5 / Web Server</div>
   <h1>Your server, under control.</h1>
   <p>This page is served by the native Go HTTPS handler running as a Sentinel persistent plugin. Configure virtual hosts and routes from <code>config.yml</code>.</p>
   <div class="stat"><span class="dot"></span> Web service online</div>
   <p>Try <a href="/api/version">/api/version</a> or <a href="/_sentinel/health">/_sentinel/health</a>.</p>
 </main>
</body>
</html>
