version: 1
id: c2-relay
name: C2 Relay
description: Multi-provider method configuration and fixed HTTPS health checks
enabled: false
roles: [admin, operator]
runtime:
  kind: exec
  binary: c2-relay
  timeout_ms: 5000
commands:
  - name: info
    description: Show validated C2 Relay configuration
    capability: code.invoke
  - name: methods
    description: List available offline previews
    capability: code.invoke
  - name: providers
    description: Inspect configured API providers and endpoint counts
    capability: code.invoke
  - name: tcp
    description: Validate dynamic TCP method arguments and provider mapping
    capability: code.invoke
  - name: udp
    description: Validate dynamic UDP method arguments and provider mapping
    capability: code.invoke
  - name: http
    description: Validate dynamic HTTP method arguments and provider mapping
    capability: code.invoke
  - name: check
    description: Query fixed approved HTTPS health/status endpoints
    capability: code.invoke
  - name: views
    description: Show the SML screen gallery (demo only)
    capability: code.invoke
  - name: help
    description: Display command documentation in SML
    capability: code.invoke
